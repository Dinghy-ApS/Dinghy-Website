<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HarborHub – Bekræfter...</title>
  </head>
  <body>
    <p>Åbner appen…</p>

    <script>
      // Behold både querystring og hash (Supabase kan bruge hash i nogle flows)
      const qs = window.location.search || "";
      const hash = window.location.hash || "";

      // Send brugeren videre til appen
      const deepLink = "harborhub://auth/callback" + qs + hash;
      window.location.replace(deepLink);

      // Fallback hvis app ikke åbner (ikke installeret / Expo Go etc.)
      setTimeout(() => {
        document.body.innerHTML =
          "<p>Hvis appen ikke åbner automatisk, så åbn HarborHub manuelt og prøv igen.</p>";
      }, 1200);
    </script>
  </body>
</html>
